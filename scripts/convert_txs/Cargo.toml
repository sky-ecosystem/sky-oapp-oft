[package]
name = "convert-txs"
version = "0.1.0"
edition = "2021"
description = "Convert Solana VersionedTransactions into GovernanceMessages"

[dependencies]
governance = { path = "../../programs/governance", features = ["no-entrypoint"] }
solana-sdk = "1.17.31"
solana-program = "1.17.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bincode = "1.3"
base64 = "0.22"
